  function archivBanner(){ const sea = selSaison(); return sea.current ? '' : `<div class="running archiv">📦 <div style="flex:1"><b>Archiv: ${sea.label}</b><br><small>nur ansehen</small></div><button onclick="App.setSaison(0)">Aktuell</button></div>`; }
  const saisonBtn = () => `<button class="saisonbtn" onclick="App.saisonPick()">${selSaison().label} ▾</button>`;

  /* ---------- Geometrie in lokalen Metern ---------- */
  function proj(pts){
    const lat0 = pts.reduce((s,p) => s + p[0], 0) / pts.length, lng0 = pts.reduce((s,p) => s + p[1], 0) / pts.length;
    const kx = Math.cos(lat0 * Math.PI / 180) * 111320, ky = 110540;
    return { to: p => [(p[1] - lng0) * kx, (p[0] - lat0) * ky], from: q => [+(lat0 + q[1] / ky).toFixed(7), +(lng0 + q[0] / kx).toFixed(7)] };
  }
  function areaM2(xy){ let a = 0; for (let i = 0; i < xy.length; i++) { const p = xy[i], q = xy[(i+1) % xy.length]; a += p[0]*q[1] - q[0]*p[1]; } return Math.abs(a) / 2; }
  function genRows(xy, angDeg, spacing, offset){
    const a = angDeg * Math.PI / 180, d = [Math.cos(a), Math.sin(a)], n = [-Math.sin(a), Math.cos(a)];
    const dot = (p, v) => p[0]*v[0] + p[1]*v[1];
    const ps = xy.map(p => dot(p, n)), mn = Math.min(...ps), mx = Math.max(...ps);
    const base = offset + spacing / 2, first = base + Math.ceil((mn - base) / spacing) * spacing;
    const rows = [];
    for (let s0 = first; s0 < mx; s0 += spacing) {
      const ts = [];
      for (let i = 0; i < xy.length; i++) {
        const A = xy[i], B = xy[(i+1) % xy.length], sa = dot(A, n) - s0, sb = dot(B, n) - s0;
        if ((sa > 0) !== (sb > 0)) { const ta = dot(A, d), tb = dot(B, d); ts.push(ta + (tb - ta) * sa / (sa - sb)); }
      }
      ts.sort((x, y) => x - y);
      for (let k = 0; k + 1 < ts.length; k += 2) if (ts[k+1] - ts[k] > 2)
        rows.push([[n[0]*s0 + d[0]*ts[k], n[1]*s0 + d[1]*ts[k]], [n[0]*s0 + d[0]*ts[k+1], n[1]*s0 + d[1]*ts[k+1]]]);
    }
    return rows;
  }
  function longestEdgeAngle(xy){
    let best = 0, ang = 0;
    for (let i = 0; i < xy.length; i++) { const A = xy[i], B = xy[(i+1) % xy.length], l = Math.hypot(B[0]-A[0], B[1]-A[1]);
      if (l > best) { best = l; ang = Math.atan2(B[1]-A[1], B[0]-A[0]) * 180 / Math.PI; } }
    return ang;
  }
  /* Reihen im gedrehten Rahmen (Reihen liegen waagerecht) */
  function polysOf(u){ const p = jparse(u, []); if (!Array.isArray(p) || !p.length) return []; return typeof p[0][0] === 'number' ? [p] : p; }
  const frameCache = new Map();
  function frame(w){
    const key = w.Weinberg_ID + '|' + (w.Reihen || '').length + '|' + (w.Umriss || '').length + '|' + w.Reihen_Anzahl + '|' + w.Zeilenbreite_m;
    if (frameCache.has(key)) return frameCache.get(key);
    let res = null;
    const polys = polysOf(w.Umriss).filter(p => p.length >= 3), rws = jparse(w.Reihen, []);
    const sp = num(w.Zeilenbreite_m) || 2;
    if (polys.length && rws.length) {
      const P = proj(polys.flat());
      const r0 = [P.to([rws[0][0], rws[0][1]]), P.to([rws[0][2], rws[0][3]])];
      const a = Math.atan2(r0[1][1] - r0[0][1], r0[1][0] - r0[0][0]), c = Math.cos(-a), s = Math.sin(-a);
      const rot = p => [p[0]*c - p[1]*s, -(p[0]*s + p[1]*c)];
      const rows = rws.map(r => { let A = rot(P.to([r[0], r[1]])), B = rot(P.to([r[2], r[3]])); if (A[0] > B[0]) [A, B] = [B, A];
        return { x0: A[0], x1: B[0], y: (A[1] + B[1]) / 2, len: Math.hypot(B[0]-A[0], B[1]-A[1]) }; });
      res = { rows, polys: polys.map(p => p.map(P.to).map(rot)), sp, toF: ll => rot(P.to(ll)) };
    } else {
      const n = Math.round(num(w.Reihen_Anzahl) || 0);
      if (n > 0) {
        const ha = num(w.Flaeche_ha), len = ha ? Math.max(20, Math.min(400, ha * 10000 / (n * sp))) : 100;
        const rows = Array.from({ length: n }, (_, i) => ({ x0: 0, x1: len, y: i * sp, len }));
        res = { rows, polys: [[[-sp/2, -sp/2], [len + sp/2, -sp/2], [len + sp/2, n*sp - sp/2], [-sp/2, n*sp - sp/2]]], sp, schema: true };
      }

    // Reihen von oben nach unten nummerieren
    if (res) { const idx = res.rows.map((r, i) => i); res.order = idx; }
    frameCache.set(key, res);

  /* Gassen (zwischen zwei Reihen) für Bodenarbeiten wie Mulchen */
  function gasseFrame(f){

        const x0 = Math.max(a.x0, b.x0), x1 = Math.min(a.x1, b.x1); if (x1 - x0 < 2) return;
        if (dy < bd) { bd = dy; best = { x0, x1, y: (a.y + b.y) / 2, len: x1 - x0, ai }; } });
      if (best) g.push(best); });

  /* Laubwände: jede Reihe hat zwei Seiten (a = obere, b = untere im Bild) */

  /* ---------- Zeichnen ---------- */

        const [z, n] = nr.split('/').map(s => s.trim());
        const eq = (pre, k, v) => `<fes:PropertyIsEqualTo><fes:ValueReference>${pre}${k}</fes:ValueReference><fes:Literal>${xmlEsc(v)}</fes:Literal></fes:PropertyIsEqualTo>`;
        const filt = pre => `<fes:Filter xmlns:fes="http://www.opengis.net/fes/2.0" xmlns:ave="http://repository.gdi-de.org/schemas/adv/produkt/alkis-vereinfacht/2.0"><fes:And>${eq(pre, 'gemarkung', gem)}${eq(pre, 'flstnrzae', z)}${flur ? eq(pre, 'flur', 'Flur ' + flur) : ''}${n ? eq(pre, 'flstnrnen', n) : ''}</fes:And></fes:Filter>`;
        let list;
        try { list = parseFlst(await wfsFetch('FILTER=' + encodeURIComponent(filt('')))); }
        catch (e) { list = parseFlst(await wfsFetch('FILTER=' + encodeURIComponent(filt('ave:')))); }
        if (!n) { const ohne = list.filter(f => !f.nr.includes('/')); if (ohne.length) list = ohne; }
        if (list.length === 1) found.push(list[0]); else if (list.length > 1) amb.push(...list); else K.msg = `${nr} nicht gefunden – Schreibweise der Gemarkung prüfen oder das Flurstück auf der Karte antippen.`;
      }
      found.forEach(f => { if (!K.parcels.some(x => x.id === f.id)) kAddParcel(f); });
      if (found.length) { K.msg = `${found.length} Flurstück${found.length > 1 ? 'e' : ''} übernommen – passt der Umriss?`; kFit(); }
      if (amb.length) { K.hits = amb; K.msg = 'Mehrere Treffer – bitte das richtige wählen:'; }
    } catch (e) { K.msg = '⚠️ ' + e.message; }
    K.busy = false; kDraw();
  }
  function kPick(i){ const f = K.hits && K.hits[i]; if (!f) return; K.hits = null; kAddParcel(f); kFit(); kDraw(); }
  function kDel(i){ K.parcels.splice(i, 1); K.msg = ''; kDraw(); }
  function kMode(m){ K.mode = m; K.msg = ''; kDraw(); }
  function kQ(k, v){ K.q[k] = v; }
  function kRows(){
    const polys = kPolys(), P = proj(polys.flat()), xys = polys.map(p => p.map(P.to));
    if (K.ang == null) { const big = xys.slice().sort((a, b) => areaM2(b) - areaM2(a))[0]; K.ang = longestEdgeAngle(big); }
    const a = K.ang * Math.PI / 180, nrm = [-Math.sin(a), Math.cos(a)], dir = [Math.cos(a), Math.sin(a)];
    const rows = xys.flatMap(xy => genRows(xy, K.ang, K.sp, K.off));
    const key = r => [r[0][0]*nrm[0] + r[0][1]*nrm[1], Math.min(r[0][0]*dir[0] + r[0][1]*dir[1], r[1][0]*dir[0] + r[1][1]*dir[1])];
    rows.sort((x, y) => { const kx = key(x), ky = key(y); return (ky[0] - kx[0]) || (kx[1] - ky[1]); });
    return { rows: rows.map(r => [...P.from(r[0]), ...P.from(r[1])]), area: xys.reduce((s, xy) => s + areaM2(xy), 0) };
  }
  function kDraw(){
    if (!K || !K.map) return;
    K.lyr.clearLayers();
    const done = K.step !== 'umriss', polys = kPolys();
    polys.forEach(p => L.polygon(p, { color: '#F5EFE6', weight: 2.5, fillColor: '#F0B35A', fillOpacity: done ? 0.06 : 0.25, dashArray: K.mode === 'hand' && !done ? '6 6' : null, interactive: false }).addTo(K.lyr));
    if (K.step === 'umriss' && K.mode === 'hand') K.pts.forEach(p => L.circleMarker(p, { radius: 6, color: '#fff', weight: 2, fillColor: '#6E1F2F', fillOpacity: 1 }).addTo(K.lyr));
    if (K.step === 'umriss' && K.hits) K.hits.forEach(h => L.polygon(h.poly, { color: '#5BC0EB', weight: 2, fillOpacity: .15, interactive: false }).addTo(K.lyr));
    if (K.step === 'richtung' && K.line.length) { L.polyline(K.line, { color: '#F0B35A', weight: 4 }).addTo(K.lyr); K.line.forEach(p => L.circleMarker(p, { radius: 6, color: '#fff', weight: 2, fillColor: '#F0B35A', fillOpacity: 1 }).addTo(K.lyr)); }
    let info = '';
    if (K.step === 'reihen' && polys.length) { const r = kRows(); K.rowsLL = r.rows; K.area = r.area;
      r.rows.forEach((x, i) => L.polyline([[x[0], x[1]], [x[2], x[3]]], { color: i === 0 ? '#F0B35A' : '#FFFFFF', weight: 2, opacity: .9, interactive: false }).addTo(K.lyr));
      info = `<b>${r.rows.length} Reihen</b> · ${fmtNum(r.area / 10000, 3)} ha · Zeilenbreite ${fmtNum(K.sp, 2)} m · Winkel ${fmtNum(((K.ang % 180) + 180) % 180, 1)}°`; }
    const H = { umriss: K.mode === 'hand' ? 'Schritt 1/3: Tippe die Ecken des Weinbergs der Reihe nach an.' : 'Schritt 1/3: Flurstück eintragen und suchen – oder einfach auf der Karte auf das Flurstück tippen. Mehrere gehen auch.',
      richtung: 'Schritt 2/3: Tippe zwei Punkte entlang einer Rebzeile (Anfang und Ende einer Reihe) – oder überspringen, dann nimmt die App die längste Kante.', reihen: 'Schritt 3/3: Passen die Reihen? Mit den Knöpfen ausrichten, bis die weißen Linien auf den Zeilen liegen.' };
    $('#kHint').textContent = H[K.step];
    const B = (t, f, on) => `<button type="button" class="${on ? 'on' : ''}" onclick="${f}">${t}</button>`;
    const msg = K.msg ? `<p class="note${K.msg.startsWith('⚠️') ? ' warn' : ''}" style="margin:10px 0">${esc(K.msg)}</p>` : '';
    if (K.step === 'umriss') {
      const ha = K.parcels.reduce((s, p) => s + (p.flaeche || 0), 0);
      $('#kCtl').innerHTML = `<div class="mapctl">${B('Flurstück', "App.kMode('flst')", K.mode === 'flst')}${B('Ecken selbst setzen', "App.kMode('hand')", K.mode === 'hand')}</div>` +
        (K.mode === 'flst' ? `<form class="flst" onsubmit="event.preventDefault();App.kSearch()">
            <input placeholder="Gemarkung" value="${esc(K.q.gem)}" oninput="App.kQ('gem',this.value)" autocapitalize="words">
            <input placeholder="Flur" value="${esc(K.q.flur)}" oninput="App.kQ('flur',this.value)" inputmode="numeric" style="max-width:70px">
            <input placeholder="Nr. z. B. 123/4" value="${esc(K.q.nr)}" oninput="App.kQ('nr',this.value)" style="max-width:120px">
            <button class="btn small" type="submit" ${K.busy ? 'disabled' : ''}>${K.busy ? '…' : 'Suchen'}</button></form>${msg}
            ${K.hits ? `<div class="card">${K.hits.map((h, i) => `<button class="row" onclick="App.kPick(${i})"><div class="main"><div class="title">${esc(h.gemarkung)} · Flur ${esc(h.flur)} · ${esc(h.nr)}</div><div class="sub">${esc(h.kreis)}${h.lage ? ' · ' + esc(h.lage) : ''}${h.flaeche ? ' · ' + fmtNum(h.flaeche, 0) + ' m²' : ''}</div></div></button>`).join('')}</div>` : ''}
            ${K.parcels.length ? `<div class="card" style="margin-top:8px">${K.parcels.map((p, i) => `<div class="row"><div class="main"><div class="title">${p.gemarkung ? esc(p.gemarkung) + ' · Flur ' + esc(p.flur) + ' · ' : ''}${esc(p.nr)}</div><div class="sub">${[p.flaeche ? fmtNum(p.flaeche, 0) + ' m²' : '', esc(p.lage || ''), esc(p.nutzung || '')].filter(Boolean).join(' · ')}</div></div><button class="btn sec small" style="width:auto;margin:0" onclick="App.kDel(${i})">✕</button></div>`).join('')}</div>
              ${ha ? `<p class="note" style="margin:8px 0">Amtliche Fläche zusammen: <b>${fmtNum(ha / 10000, 4)} ha</b></p>` : ''}` : ''}`
          : `${msg}<div class="mapctl">${B('↶ Punkt zurück', 'App.kUndo()')}${B('📍 Mein Standort', 'App.kGps()')}</div>`) +
        `<button class="btn" onclick="App.kStep('richtung')" ${polys.length ? '' : 'disabled style="opacity:.45"'}>Weiter: Zeilenrichtung</button>`;
    } else if (K.step === 'richtung') {
      $('#kCtl').innerHTML = `<div class="mapctl">${B('↶ Zurück zum Umriss', "App.kStep('umriss')")}</div><button class="btn" onclick="App.kStep('reihen')">${K.line.length === 2 ? 'Weiter: Reihen prüfen' : 'Überspringen (längste Kante)'}</button>`;
    } else {
      $('#kCtl').innerHTML = `<p class="note" style="margin:10px 0">${info}</p>
         <div class="mapctl">${B('⟲ −1°', 'App.kAdj("ang",-1)')}${B('−0,2°', 'App.kAdj("ang",-0.2)')}${B('+0,2°', 'App.kAdj("ang",0.2)')}${B('⟳ +1°', 'App.kAdj("ang",1)')}</div>
         <div class="mapctl">${B('◀ Versatz', 'App.kAdj("off",-0.2)')}${B('Versatz ▶', 'App.kAdj("off",0.2)')}${B('Zeile enger', 'App.kAdj("sp",-0.05)')}${B('Zeile weiter', 'App.kAdj("sp",0.05)')}</div>
         <div class="mapctl">${B('Richtung neu', "App.kStep('richtung')")}${B('Umriss ändern', "App.kStep('umriss')")}</div>
         ${S.snap.arbeiten.some(a => a.Weinberg_ID === K.id) ? '<p class="note warn">Achtung: Wenn sich die Zahl der Reihen ändert, passen frühere Markierungen evtl. nicht mehr genau.</p>' : ''}
         <button class="btn" onclick="App.kSave()">Umriss & Reihen speichern</button>`;
    }
  }
  function kStep(s){
    if (s === 'reihen' && K.step === 'richtung' && K.line.length === 2) { const P = proj(kPolys().flat()), a = P.to(K.line[0]), b = P.to(K.line[1]); K.ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI; K.off = 0; }
    if (s === 'richtung') { K.line = []; if (K.step === 'umriss') K.ang = null; }
    K.step = s; K.msg = ''; kDraw();
  }
  function kNew(){ K.pts = []; K.parcels = []; K.ang = null; K.step = 'umriss'; kDraw(); }
  function kUndo(){ K.pts.pop(); kDraw(); }
  function kGps(){
    if (!navigator.geolocation) return toast('Standort nicht verfügbar');
    navigator.geolocation.getCurrentPosition(p => { K.pts.push([+p.coords.latitude.toFixed(7), +p.coords.longitude.toFixed(7)]); K.map.panTo([p.coords.latitude, p.coords.longitude]);

  }

      <div class="card" style="padding:10px 12px;margin-bottom:14px"><b>📍 Erkannt</b><br>${det.length ? det.map(x => `${esc(x.w.Name)}: ${x.passes} Gasse${x.passes === 1 ? '' : 'n'}, ca. ${Math.round(x.pct)} %${x.stunden ? ', ' + fmtNum(x.stunden) + ' h' : ''}`).join('<br>') : '<span style="color:var(--muted)">noch kein Weinberg</span>'}</div>
      <button class="btn" onclick="App.jobEnd()">${det.length ? 'Beenden & Spuren prüfen' : 'Beenden'}</button>
      <button class="btn sec" onclick="App.closeSheet()">Weiter aufzeichnen</button>
      <button class="btn sec" onclick="App.jobCancel(this)">Aufzeichnung verwerfen</button>`);
  }
  function jobEnd(){
    const jb = S.ui.job; if (!jb) return;
    const det = gpsDetect(), base = uid();
    const review = det.map((x, i) => ({ id: x.w.Weinberg_ID, arbeit: jb.arbeit, segs: x.segs, sid: `${base}-${i}`, datum: jb.datum, person: S.name || '', notiz: 'per GPS', stunden: x.stunden || null }));
    trkStop(); delete S.ui.job;
    S.ui.psReview = (S.ui.psReview || []).concat(review); save();
    closeSheet(); render();
    if (review.length) psReviewNext(); else toast('Beendet – kein Weinberg erkannt');
  }
  function jobCancel(btn){
    if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = 'Wirklich verwerfen?'; btn.classList.add('danger'); return; }
    trkStop(); delete S.ui.job; save(); closeSheet(); render(); toast('Aufzeichnung verworfen');
  }

  /* ---------- Startseite ---------- */
  function viewHome(){
    const h = new Date().getHours(), gruss = h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend';
    const bel = S.snap.behaelter.filter(f => f.Aktuelle_Weinnummer), liter = bel.reduce((s, f) => s + (num(f.Fuellstand_L) || 0), 0);
    const wbs = wbList(), ha = wbs.reduce((s, w) => s + (num(w.Flaeche_ha) || 0), 0);
    return `<div class="home"><h1>${gruss}${S.name ? ', ' + esc(S.name) : ''}</h1><p class="lead">Wo arbeitest du gerade?</p>
      ${S.ui.job ? `<button class="running job" style="width:100%;text-align:left" onclick="App.setMode('weinberg');App.go('ps')">🚜 <div><b>${esc(S.ui.job.arbeit)} läuft</b><br><small>seit ${esc(S.ui.job.beginn)} Uhr – hier tippen</small></div></button>` : ''}
      ${S.ui.psDraft ? `<button class="running" style="width:100%;text-align:left" onclick="App.setMode('weinberg');App.go('ps')">💧 <div><b>Spritzung läuft</b><br><small>seit ${esc(S.ui.psDraft.beginn)} Uhr – hier tippen</small></div></button>` : ''}
      <button class="homecard keller" onclick="App.setMode('keller')"><span class="hc-ico">🍷</span><span><b>Keller</b><small>${bel.length} Fässer belegt · ${fmtNum(liter, 0)} L${offeneAufg().length ? ` · 📝 ${offeneAufg().length} offen` : ''}</small></span></button>
      <button class="homecard weinberg" onclick="App.setMode('weinberg')"><span class="hc-ico">🍇</span><span><b>Weinberg</b><small>${wbs.length} Weinberge · ${fmtHa(ha) || '0 ha'}</small></span></button>
      <button class="homecard verkauf" onclick="App.setMode('verkauf')"><span class="hc-ico">🍾</span><span><b>Verkauf</b><small>${S.snap.flaschen.reduce((s, b) => s + (num(b.Anzahl) || 0), 0).toLocaleString('de-DE')} Flaschen · ${(n => n + (n === 1 ? ' Bestellung' : ' Bestellungen') + ' offen')(S.snap.bestellungen.filter(b => !b.Storniert_am && !(b.Abgeholt_am && b.Bezahlt_am)).length)}</small></span></button>
      ${(S.ui.psReview || []).length ? `<button class="btn sec" onclick="App.setMode('weinberg');App.psReviewNext()">GPS-Spuren prüfen (${S.ui.psReview.length})</button>` : ''}</div>`;
  }

  /* =====================================================================
     VERKAUF: Flaschenlager, Kunden, Bestellungen
     ===================================================================== */
  const GROESSEN = ['0.75', '1', '0.5', '0.375', '1.5', '0.2'];
  const fmtG = g => String(+g).replace('.', ',') + ' l';
  const fmtEur = v => v == null || v === '' || isNaN(+v) ? '' : (+v).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  const artId = (wnr, g) => `${wnr}|${+g}`;
  const artikel = id => S.snap.artikel.find(a => a.Artikel_ID === id);
  const artName = id => { const a = artikel(id); return a ? a.Name : id; };
  function bestandFl(id){ return S.snap.flaschen.filter(b => b.Artikel_ID === id).reduce((s, b) => s + (num(b.Anzahl) || 0), 0); }
  const bestPos = b => jparse(b.Positionen, []);
  const bestStatus = b => b.Storniert_am ? 'storniert' : b.Abgeholt_am && b.Bezahlt_am ? 'erledigt' : b.Abgeholt_am ? 'abgeholt' : b.Bezahlt_am ? 'bezahlt' : 'offen';
  const STATUS_TXT = { offen: 'bestellt', abgeholt: 'abgeholt · offen zu zahlen', bezahlt: 'bezahlt · noch abholen', erledigt: 'erledigt', storniert: 'storniert' };
  function reserviert(id){ return S.snap.bestellungen.filter(b => !b.Abgeholt_am && !b.Storniert_am).reduce((s, b) => s + bestPos(b).filter(p => p.a === id).reduce((x, p) => x + (num(p.n) || 0), 0), 0); }
  const kunde = id => S.snap.kunden.find(k => k.Kunde_ID === id);
  const aktiveArtikel = () => S.snap.artikel.filter(a => (a.Aktiv || 'ja') !== 'nein').sort((a, b) => String(a.Name).localeCompare(String(b.Name), 'de', { numeric: true }));

  function viewLager(){
    const list = aktiveArtikel();
    const tot = list.reduce((s, a) => s + bestandFl(a.Artikel_ID), 0);
    const rows = list.map(a => { const b = bestandFl(a.Artikel_ID), r = reserviert(a.Artikel_ID);
      return `<button class="row" onclick="App.openArtikel('${esc(a.Artikel_ID)}')"><span class="swatch" style="background:${FARBE[(wein(a.Weinnummer) || {}).Farbe] || '#C9B9A2'}"></span>
        <div class="main"><div class="title">${esc(a.Name)}</div><div class="sub">${[a.Weinnummer ? esc(a.Weinnummer) : '', a.Preis ? fmtEur(a.Preis) : 'kein Preis', r ? `<b style="color:#8A5A10">${r} reserviert</b>` : ''].filter(Boolean).join(' · ')}</div></div>
        <div class="right">${b.toLocaleString('de-DE')}<small>Flaschen</small></div></button>`; }).join('');
    return `<div class="section-title"><h2>Flaschenlager</h2><small>${tot.toLocaleString('de-DE')} Flaschen</small></div>
      <div class="card">${rows || '<div class="empty">Noch keine Flaschen. Beim <b>Abfüllen</b> im Keller kommen sie automatisch hierher – oder lege alte Bestände unten an.</div>'}</div>
      <div class="btnrow" style="margin-top:14px"><button class="btn sec small" onclick="App.artikelForm()">+ Wein / Bestand anlegen</button><button class="btn sec small" onclick="App.printLager()">🖨️ Bestandsliste</button></div>`;
  }
  function openArtikel(id){
    const a = artikel(id); if (!a) return;
    const mv = S.snap.flaschen.filter(b => b.Artikel_ID === id).sort((x, y) => String(y.Datum).localeCompare(String(x.Datum))).slice(0, 60);
    const b = bestandFl(id), r = reserviert(id);
    openSheet(`<h2>${esc(a.Name)}</h2><p class="lead">${[a.Weinnummer ? 'Weinnummer ' + esc(a.Weinnummer) : '', a.Groesse_L ? fmtG(a.Groesse_L) : '', a.Preis ? fmtEur(a.Preis) + ' je Flasche' : ''].filter(Boolean).join(' · ')}</p>
      <div class="card" style="padding:14px;margin-bottom:12px"><dl class="kv"><dt>Auf Lager</dt><dd><b>${b.toLocaleString('de-DE')} Flaschen</b></dd>${r ? `<dt>Reserviert (offene Bestellungen)</dt><dd>${r}</dd><dt>Frei</dt><dd>${b - r}</dd>` : ''}</dl></div>
      <div class="actions">
        <button class="act" onclick="App.flBuchen('${esc(id)}','Verkauf')"><span class="ico">🛒</span>Verkauf ab Hof</button>
        <button class="act" onclick="App.flBuchen('${esc(id)}','Eigenverbrauch')"><span class="ico">🍷</span>Eigenverbrauch</button>
        <button class="act" onclick="App.flBuchen('${esc(id)}','Bruch/Schwund')"><span class="ico">💥</span>Bruch</button>
        <button class="act" onclick="App.flBuchen('${esc(id)}','Probe/Geschenk')"><span class="ico">🎁</span>Probe / Geschenk</button>
        <button class="act" onclick="App.flBuchen('${esc(id)}','Zugang')"><span class="ico">📥</span>Zugang</button>
        <button class="act" onclick="App.flBuchen('${esc(id)}','Inventur')"><span class="ico">✏️</span>Inventur (Bestand)</button></div>
      <button class="btn sec" onclick="App.artikelForm('${esc(id)}')">Name / Preis ändern</button>
      <div class="log-day" style="margin-top:14px">Bewegungen</div>
      <div class="card">${mv.map(m => `<div class="row"><div class="main"><div class="title">${esc(m.Art)}${m.Kunde ? ' · ' + esc(m.Kunde) : ''}</div><div class="sub">${fmtDate(m.Datum)}${m.Notiz ? ' · ' + esc(m.Notiz) : ''}${m.Erfasst_von ? ' · ' + esc(m.Erfasst_von) : ''}</div>${m._pending ? '<div class="pending">⟳ wartet auf Übertragung</div>' : ''}</div>
        <div class="right" style="color:${num(m.Anzahl) < 0 ? '#B4452A' : '#2F7D5B'}">${num(m.Anzahl) > 0 ? '+' : ''}${num(m.Anzahl)}</div></div>`).join('') || '<div class="empty">Noch keine Bewegungen.</div>'}</div>`);
  }
  function artikelForm(id){
    const a = (id && artikel(id)) || {};
    const weine = S.snap.partien;
    openSheet(`<h2>${id ? 'Wein im Lager bearbeiten' : 'Wein / Bestand anlegen'}</h2><p class="lead">${id ? '' : 'Für Flaschen, die nicht über „Abfüllen“ kamen – z. B. ältere Jahrgänge oder Zukauf.'}</p>
      <form id="frm" onsubmit="event.preventDefault();App.artikelSave('${esc(id || '')}')"><p id="frmErr" class="note warn" hidden></p>
        ${field('Bezeichnung', inTxt('Name', a.Name, 'z. B. 2025 Riesling trocken 1,0 l'))}
        <div class="two">${field('Wein (optional)', `<select name="Weinnummer"><option value="">–</option>${weine.map(p => `<option value="${esc(p.Weinnummer)}" ${p.Weinnummer === a.Weinnummer ? 'selected' : ''}>${esc(p.Weinnummer)} ${esc(p.Bezeichnung)}</option>`).join('')}</select>`)}
          ${field('Flasche', `<select name="Groesse_L">${GROESSEN.map(g => `<option value="${g}" ${+g === +(a.Groesse_L || 0.75) ? 'selected' : ''}>${fmtG(g)}</option>`).join('')}</select>`)}</div>
        <div class="two">${field('Preis je Flasche (€)', inNum('Preis', num(a.Preis), 'optional'))}${id ? '<div></div>' : field('Bestand jetzt', inNum('Anzahl', null, 'Flaschen', '1'))}</div>
        <button class="btn" type="submit">Speichern</button>
        ${id ? `<button class="btn sec" type="button" onclick="App.artikelAus('${esc(id)}')">${(a.Aktiv || 'ja') === 'nein' ? 'Wieder anzeigen' : 'Ausblenden (ausverkauft)'}</button>` : ''}
        <button class="btn sec" type="button" onclick="App.closeSheet()">Abbrechen</button></form>`);
  }
  function artikelSave(id){
    const fd = Object.fromEntries(new FormData($('#frm')).entries());
    if (!fd.Name || !fd.Name.trim()) return formError('Bitte eine Bezeichnung eintragen.');
    const old = (id && artikel(id)) || {};
    const aid = id || (fd.Weinnummer ? artId(fd.Weinnummer, fd.Groesse_L) : 'A-' + uid().slice(0, 8));
    if (!id && artikel(aid)) return formError('Diesen Wein in dieser Flaschengröße gibt es schon im Lager.');
    const a = Object.assign({}, old, { Artikel_ID: aid, Name: fd.Name.trim(), Weinnummer: fd.Weinnummer || '', Groesse_L: num(fd.Groesse_L), Preis: num(fd.Preis), Aktiv: old.Aktiv || 'ja' });
    delete a._pending;
    const op = { artikel: a };
    if (!id && num(fd.Anzahl)) op.flaschen = [{ Bewegung_ID: uid(), Datum: today(), Artikel_ID: aid, Artikel: a.Name, Weinnummer: a.Weinnummer, Groesse_L: a.Groesse_L, Anzahl: num(fd.Anzahl), Art: 'Anfangsbestand', Erfasst_am: new Date().toISOString(), Erfasst_von: S.name || '' }];
    queueOp(op, 'Gespeichert'); openArtikel(aid);
  }
  function artikelAus(id){ const a = artikel(id); if (!a) return; const u = Object.assign({}, a, { Aktiv: (a.Aktiv || 'ja') === 'nein' ? 'ja' : 'nein' }); delete u._pending; queueOp({ artikel: u }, u.Aktiv === 'nein' ? 'Ausgeblendet' : 'Wieder sichtbar'); closeSheet(); }
  function flBuchen(id, art){
    const a = artikel(id); if (!a) return;
    const inv = art === 'Inventur';
    openSheet(`<h2>${esc(art)}</h2><p class="lead">${esc(a.Name)} · auf Lager: ${bestandFl(id)}</p>
      <form id="frm" onsubmit="event.preventDefault();App.flSave('${esc(id)}','${esc(art)}')"><p id="frmErr" class="note warn" hidden></p>
        <div class="two">${field(inv ? 'Gezählter Bestand' : 'Flaschen', inNum('Anzahl', null, inv ? 'tatsächlich da' : 'Anzahl', '1'))}${field('Datum', `<input name="Datum" type="date" value="${today()}">`)}</div>
        ${art === 'Verkauf' ? field('Käufer (optional)', inTxt('Kunde', '', 'Name')) : ''}
        ${field('Notiz', inTxt('Notiz', '', 'optional'))}
        <button class="btn" type="submit">Buchen</button><button class="btn sec" type="button" onclick="App.openArtikel('${esc(id)}')">Abbrechen</button></form>`);
  }
  function flSave(id, art){
    const a = artikel(id), fd = Object.fromEntries(new FormData($('#frm')).entries());
    let n = num(fd.Anzahl); if (n == null) return formError('Bitte die Anzahl eintragen.');
    if (art === 'Inventur') { n = n - bestandFl(id); if (!n) { toast('Bestand stimmt schon'); return openArtikel(id); } }
    else if (art !== 'Zugang') n = -Math.abs(n);
    queueOp({ flaschen: [{ Bewegung_ID: uid(), Datum: fd.Datum || today(), Artikel_ID: id, Artikel: a.Name, Weinnummer: a.Weinnummer || '', Groesse_L: a.Groesse_L, Anzahl: n, Art: art,
      Kunde: fd.Kunde || '', Notiz: fd.Notiz || '', Erfasst_am: new Date().toISOString(), Erfasst_von: S.name || '' }] }, `${art}: ${n > 0 ? '+' : ''}${n}`);
    openArtikel(id);
  }

  /* ---------- Bestellungen ---------- */
  function viewBest(){
    const all = [...S.snap.bestellungen].sort((a, b) => String(b.Datum).localeCompare(String(a.Datum)) || String(b.Erfasst_am || '').localeCompare(String(a.Erfasst_am || '')));
    const card = b => { const st = bestStatus(b), pos = bestPos(b);
      return `<button class="row" onclick="App.openBest('${esc(b.Bestellung_ID)}')"><div class="main"><div class="title">${esc(b.Kunde || 'ohne Name')}</div>
        <div class="sub">${fmtDate(b.Datum)}${b.Abholung_geplant ? ' · Abholung ' + fmtDate(b.Abholung_geplant) : ''} · ${pos.map(p => `${p.n}× ${esc(p.name || artName(p.a))}`).join(', ')}</div>
        <span class="chip st-${st}">${STATUS_TXT[st]}</span>${b._pending ? '<div class="pending">⟳ wartet auf Übertragung</div>' : ''}</div><div class="right">${fmtEur(b.Summe)}</div></button>`; };
    const offen = all.filter(b => ['offen', 'abgeholt', 'bezahlt'].includes(bestStatus(b)));
    const fertig = all.filter(b => !offen.includes(b)).slice(0, 40);
    return `<div class="section-title"><h2>Offene Bestellungen</h2><small>${offen.length}</small></div>
      <div class="card">${offen.map(card).join('') || '<div class="empty">Keine offenen Bestellungen.</div>'}</div>
      <button class="btn" style="margin-top:14px" onclick="App.bestForm()">+ Neue Bestellung</button>
      ${fertig.length ? `<div class="section-title" style="margin-top:22px"><h2>Erledigt</h2><small>letzte ${fertig.length}</small></div><div class="card">${fertig.map(card).join('')}</div>` : ''}`;
  }
  function bestForm(id, kid){
    const b = (id && S.snap.bestellungen.find(x => x.Bestellung_ID === id)) || { Kunde_ID: kid || '' };
    const pos = new Map(bestPos(b).map(p => [p.a, p]));
    const arts = aktiveArtikel();
    const kn = [...S.snap.kunden].sort((a, c) => String(a.Name).localeCompare(String(c.Name), 'de'));
    openSheet(`<h2>${id ? 'Bestellung ändern' : 'Neue Bestellung'}</h2>
      <form id="frm" oninput="App.bestCalc()" onsubmit="event.preventDefault();App.bestSave('${esc(id || '')}')"><p id="frmErr" class="note warn" hidden></p>
        ${field('Kunde', `<select name="Kunde_ID" onchange="App.bestKunde(this)"><option value="">– Kunde wählen –</option><option value="__neu">+ neuer Kunde</option>${kn.map(k => `<option value="${esc(k.Kunde_ID)}" ${k.Kunde_ID === b.Kunde_ID ? 'selected' : ''}>${esc(k.Name)}</option>`).join('')}</select>`)}
        <div id="neuKunde" style="display:none"><div class="two">${field('Name', inTxt('kName', '', 'Vor- und Nachname'))}${field('Telefon', `<input name="kTel" type="tel" placeholder="optional">`)}</div></div>
        <div class="two">${field('Bestellt am', `<input name="Datum" type="date" value="${esc(String(b.Datum || today()).slice(0, 10))}">`)}${field('Abholung geplant', `<input name="Abholung_geplant" type="date" value="${esc(String(b.Abholung_geplant || '').slice(0, 10))}">`, '(optional)')}</div>
        <label style="display:block;font-size:13px;font-weight:600;color:#5E4B42;margin:4px 2px 6px">Weine</label>
        <div class="card">${arts.map(a => { const p = pos.get(a.Artikel_ID) || {}; const frei = bestandFl(a.Artikel_ID) - reserviert(a.Artikel_ID) + (num(p.n) || 0);
          return `<div class="row posrow"><div class="main"><div class="title">${esc(a.Name)}</div><div class="sub">${frei} frei${a.Preis ? ' · ' + fmtEur(a.Preis) : ''}</div></div>
            <input name="n_${esc(a.Artikel_ID)}" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${p.n || ''}" class="qty">
            <input name="p_${esc(a.Artikel_ID)}" type="hidden" value="${p.p ?? (num(a.Preis) ?? '')}"></div>`; }).join('') || '<div class="empty">Noch keine Weine im Lager.</div>'}</div>
        <p class="note" id="bestSum" style="margin:10px 2px"></p>
        ${field('Notiz', inTxt('Notiz', b.Notiz, 'z. B. holt Samstag ab'))}
        <button class="btn" type="submit">Speichern</button><button class="btn sec" type="button" onclick="App.closeSheet()">Abbrechen</button></form>`);
    bestCalc();
  }
  function bestKunde(sel){ $('#neuKunde').style.display = sel.value === '__neu' ? '' : 'none'; }
  function bestRead(){
    const fd = Object.fromEntries(new FormData($('#frm')).entries());
    const pos = aktiveArtikel().map(a => ({ a: a.Artikel_ID, n: num(fd['n_' + a.Artikel_ID]) || 0, p: num(fd['p_' + a.Artikel_ID]), name: a.Name })).filter(p => p.n > 0);
    const sum = pos.reduce((s, p) => s + (p.p || 0) * p.n, 0);
    return { fd, pos, sum };
  }
  function bestCalc(){ const el = $('#bestSum'); if (!el) return; const r = bestRead(); el.innerHTML = r.pos.length ? `${r.pos.reduce((s, p) => s + p.n, 0)} Flaschen${r.pos.some(p => p.p != null) ? ` · <b>${fmtEur(r.sum)}</b>` : ''}${r.pos.some(p => p.p == null) ? ' <span style="color:var(--muted)">(Preis fehlt – im Lager beim Wein eintragen)</span>' : ''}` : 'Noch nichts ausgewählt.'; }
  function bestSave(id){
    const { fd, pos, sum } = bestRead();
    if (!pos.length) return formError('Bitte mindestens einen Wein mit Anzahl eintragen.');
    const op = {};
    let kid = fd.Kunde_ID, kname = '';
    if (kid === '__neu') { if (!fd.kName) return formError('Bitte den Namen des Kunden eintragen.');
      kid = 'K-' + uid().slice(0, 8); kname = fd.kName.trim(); op.kunde = { Kunde_ID: kid, Name: kname, Telefon: fd.kTel || '', Erstellt_am: new Date().toISOString() }; }
    else if (kid) kname = (kunde(kid) || {}).Name || '';
    else return formError('Bitte einen Kunden wählen oder neu anlegen.');
    const old = (id && S.snap.bestellungen.find(x => x.Bestellung_ID === id)) || {};
    const b = Object.assign({}, old, { Bestellung_ID: id || 'B-' + uid().slice(0, 8), Datum: fd.Datum || today(), Kunde_ID: kid, Kunde: kname, Positionen: JSON.stringify(pos),
      Summe: +sum.toFixed(2), Abholung_geplant: fd.Abholung_geplant || '', Notiz: fd.Notiz || '', Erfasst_von: old.Erfasst_von || S.name || '', Erfasst_am: old.Erfasst_am || new Date().toISOString() });
    delete b._pending; op.bestellung = b;
    queueOp(op, 'Bestellung gespeichert');
    openBest(b.Bestellung_ID);
  }
  function openBest(id){
    const b = S.snap.bestellungen.find(x => x.Bestellung_ID === id); if (!b) return;
    const st = bestStatus(b), pos = bestPos(b), k = kunde(b.Kunde_ID) || {};
    openSheet(`<h2>${esc(b.Kunde || 'Bestellung')}</h2><p class="lead"><span class="chip st-${st}">${STATUS_TXT[st]}</span> · vom ${fmtDate(b.Datum)}${b.Abholung_geplant ? ' · Abholung ' + fmtDate(b.Abholung_geplant) : ''}</p>
      <div class="card">${pos.map(p => `<div class="row"><div class="main"><div class="title">${p.n} × ${esc(p.name || artName(p.a))}</div><div class="sub">${p.p != null ? fmtEur(p.p) + ' je Flasche' : ''}</div></div><div class="right">${p.p != null ? fmtEur(p.p * p.n) : ''}</div></div>`).join('')}
        ${pos.some(p => p.p != null) ? `<div class="row"><div class="main"><b>Summe</b></div><div class="right"><b>${fmtEur(b.Summe)}</b></div></div>` : ''}</div>
      ${b.Notiz ? `<p class="note">${esc(b.Notiz)}</p>` : ''}

  /* =====================================================================
     PDF-Erzeugung im Gerät (für iPhone: dort kann eine Web-App nicht drucken)
     Liest die fertige Druckansicht (#printArea) und baut daraus ein A4-PDF.
     ===================================================================== */
  const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let pdfFile = null;
  function pdfEnc(str){
    const map = { '€': 128, '‚': 130, '„': 132, '…': 133, '–': 150, '—': 151, '‘': 145, '’': 146, '“': 147, '”': 148, '•': 149, '™': 153 };
    let out = '';
    for (const ch of String(str)) {
      let c = ch.codePointAt(0);
      if (map[ch]) c = map[ch];
      else if (ch === '→') { out += '->'; continue; }
      else if (ch === '✓') { out += 'ok'; continue; }
      else if (ch === ' ' || ch === ' ') c = 32;
      else if (c > 255) continue; // Emojis & Co. weglassen
      if (c === 40 || c === 41 || c === 92) out += '\\' + ch;
      else if (c < 32) continue;
      else if (c > 126) out += '\\' + c.toString(8).padStart(3, '0');
      else out += ch;
    }
    return out;
  }
  const mctx = document.createElement('canvas').getContext('2d');
  function tw(t, size, bold){ mctx.font = `${bold ? 'bold ' : ''}${size}px Helvetica, Arial, sans-serif`; return mctx.measureText(String(t).replace(/[^\u0000-ÿ€–—„“”‘’…•]/gu, '')).width; }
  function wrap(text, w, size, bold){
    const lines = [];
    String(text).split('\n').forEach(par => {
      const words = par.split(/\s+/).filter(Boolean); let cur = '';
      if (!words.length) { lines.push(''); return; }
      words.forEach(word => {
        let t = cur ? cur + ' ' + word : word;
        if (tw(t, size, bold) <= w) { cur = t; return; }
        if (cur) lines.push(cur);
        cur = word;
        while (tw(cur, size, bold) > w && cur.length > 1) { let i = cur.length; while (i > 1 && tw(cur.slice(0, i), size, bold) > w) i--; lines.push(cur.slice(0, i)); cur = cur.slice(i); }
      });
      if (cur) lines.push(cur);
    });
    return lines.length ? lines : [''];
  }
  function cellText(el){ const c = el.cloneNode(true); c.querySelectorAll('br').forEach(b => b.replaceWith('\n')); return c.textContent.replace(/[ \t]+/g, ' ').replace(/ *\n */g, '\n').trim(); }

  function buildPdf(){
    const area = $('#printArea'), W = 595.28, H = 841.89, M = 34, pages = [];
    let cs = '', y = 0, pageNo = 0;
    const head = { t: cellText(area.querySelector('.ph h1') || document.createElement('i')), s: cellText(area.querySelector('.psub') || document.createElement('i')),
      b: (area.querySelector('.pb') || { childNodes: [] }).childNodes[0] ? String(area.querySelector('.pb').childNodes[0].textContent || '').trim() : '', e: cellText(area.querySelector('.pb small') || document.createElement('i')) };
    const txt = (x, yy, s, size, bold, gray) => { cs += `BT ${gray ? '0.35 g ' : ''}/${bold ? 'F2' : 'F1'} ${size} Tf ${x.toFixed(2)} ${(H - yy).toFixed(2)} Td (${pdfEnc(s)}) Tj ET${gray ? ' 0 g' : ''}\n`; };
    const line = (x1, y1, x2, y2, w = 0.5, g = 0.55) => { cs += `${g} G ${w} w ${x1.toFixed(2)} ${(H - y1).toFixed(2)} m ${x2.toFixed(2)} ${(H - y2).toFixed(2)} l S 0 G\n`; };
    const rect = (x, yy, w, h, g) => { cs += `${g} g ${x.toFixed(2)} ${(H - yy - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f 0 g\n`; };
    const newPage = () => {
      if (cs) pages.push(cs); cs = ''; pageNo++; y = M;
      if (head.t) {
        txt(M, y + 13, head.t, 15, true);
        if (head.b) txt(W - M - tw(head.b, 10, true), y + 10, head.b, 10, true);
        if (head.e) txt(W - M - tw(head.e, 7.5), y + 21, head.e, 7.5, false, true);
        if (head.s) txt(M, y + 25, head.s, 8.5, false, true);
        y += 31; line(M, y, W - M, y, 1.2, 0); y += 10;
      }
    };
    const need = h => { if (y + h > H - M - 14) newPage(); };
    newPage();
    const avail = W - 2 * M;
    const table = (tbl) => {
      const hr = tbl.querySelector('thead tr'), heads = hr ? [...hr.children].map(cellText) : [];
      const body = [...tbl.querySelectorAll('tbody tr')].map(tr => [...tr.children].map(cellText));
      const foot = [...tbl.querySelectorAll('tfoot tr')].map(tr => [...tr.children].map(cellText));
      const n = Math.max(heads.length, ...body.map(r => r.length), 1), fs = n > 9 ? 6.8 : n > 7 ? 7.5 : 8.3, lh = fs * 1.22, pad = 2.6;
      // Spaltenbreiten: natürliche Breite, auf Seitenbreite skaliert, aber mindestens längstes Wort
      const nat = [], minw = [];
      for (let i = 0; i < n; i++) {
        const cells = [heads[i] || ''].concat(body.map(r => r[i] || ''), foot.map(r => r[i] || ''));
        nat[i] = Math.min(220, Math.max(...cells.map(c => Math.max(...String(c).split('\n').map(l => tw(l, fs, false))))) + 2 * pad);
        minw[i] = Math.min(90, Math.max(...cells.map(c => Math.max(...String(c).split(/\s+/).map(wd => tw(wd, fs, true))))) + 2 * pad);
      }
      let tot = nat.reduce((s, v) => s + v, 0), ws = nat.map(v => v * avail / tot);
      for (let k = 0; k < 3; k++) { let short = 0, free = 0; ws.forEach((v, i) => { if (v < minw[i]) { short += minw[i] - v; ws[i] = minw[i]; } else free += v - minw[i]; });
        if (short && free) ws = ws.map((v, i) => v > minw[i] ? v - (v - minw[i]) * short / free : v); }
      tot = ws.reduce((s, v) => s + v, 0); if (tot > avail) ws = ws.map(v => v * avail / tot);
      const drawRow = (cells, bold, bg, topLine) => {
        const ls = ws.map((w, i) => wrap(cells[i] || '', w - 2 * pad, fs, bold));
        const h = Math.max(...ls.map(l => l.length)) * lh + 2 * pad;
        if (y + h > H - M - 14) { newPage(); if (heads.length && !bg) drawRow(heads, true, 0.92); }
        if (bg) rect(M, y, avail, h, bg);
        let x = M;
        ls.forEach((l, i) => { l.forEach((s, j) => txt(x + pad, y + pad + fs * 0.95 + j * lh, s, fs, bold)); x += ws[i]; });
        line(M, y, M + avail, y, topLine ? 1.1 : 0.4, topLine ? 0 : 0.6);
        x = M; ws.forEach(w => { line(x, y, x, y + h, 0.4, 0.6); x += w; }); line(M + avail, y, M + avail, y + h, 0.4, 0.6);
        y += h; line(M, y, M + avail, y, 0.4, 0.6);
      };
      if (heads.length) drawRow(heads, true, 0.92);
      body.forEach(r => drawRow(r, false));
      foot.forEach(r => drawRow(r, true, 0, true));
      y += 10;
    };
    const kv = (tbl) => { [...tbl.querySelectorAll('tr')].forEach(tr => { const k = cellText(tr.children[0]), v = cellText(tr.children[1] || tr.children[0]);
      const ls = wrap(v, avail - 150, 9); need(ls.length * 11 + 2); txt(M, y + 9, k, 9, true); ls.forEach((s, j) => txt(M + 150, y + 9 + j * 11, s, 9)); y += ls.length * 11 + 2; }); y += 8; };
    const para = (el, size = 9, bold = false) => { const ls = wrap(cellText(el), avail, size, bold); need(ls.length * size * 1.3); ls.forEach(s => { txt(M, y + size, s, size, bold); y += size * 1.3; }); y += 4; };
    const labels = (box) => {
      const items = [...box.querySelectorAll('.lab')], cw = avail / 2, ch = (H - 2 * M) / 4;
      items.forEach((lab, i) => {
        if (i && i % 8 === 0) newPage();
        const k = i % 8, x0 = M + (k % 2) * cw, y0 = M + Math.floor(k / 2) * ch;
        cs += `0.6 G 0.5 w [3 3] 0 d ${x0.toFixed(2)} ${(H - y0 - ch).toFixed(2)} ${cw.toFixed(2)} ${ch.toFixed(2)} re S [] 0 d 0 G\n`;
        const url = lab.dataset.url, q = 120, qx = x0 + 12, qy = y0 + (ch - q) / 2;
        if (url && window.qrcode) { const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); const nmod = qr.getModuleCount(), s = q / nmod;
          for (let r = 0; r < nmod; r++) for (let c = 0; c < nmod; c++) if (qr.isDark(r, c)) cs += `${(qx + c * s).toFixed(2)} ${(H - qy - (r + 1) * s).toFixed(2)} ${(s + 0.05).toFixed(2)} ${(s + 0.05).toFixed(2)} re f\n`; }
        const tx = qx + q + 14; let ty = qy + 30;
        txt(tx, ty, cellText(lab.querySelector('.ln')), 34, true); ty += 18;
        lab.querySelectorAll('.ld').forEach(d => { const t = cellText(d); if (t) { txt(tx, ty, t, 10); ty += 13; } });
        const bt = cellText(lab.querySelector('.lb') || document.createElement('i')); if (bt) txt(tx, qy + q - 4, bt, 8, false, true);
      });
    };
    [...area.children].forEach(el => {
      if (el.classList.contains('ph')) return;
      if (el.classList.contains('labs')) return labels(el);
      if (el.matches('table.pt')) return table(el);
      if (el.matches('table.pkv')) return kv(el);
      if (el.tagName === 'H2') { need(30); y += 4; para(el, 11.5, true); return; }
      if (el.classList.contains('psign')) { need(60); y += 26; line(M, y, M + avail * 0.6, y, 0.8, 0); y += 10; txt(M, y, 'Datum, Unterschrift', 8, false, true); y += 12; return; }
      if (el.classList.contains('paddr')) { cellText(el).split('\n').forEach((s, i) => { need(14); txt(M, y + 11, s, 11, i === 0); y += 14; }); y += 8; return; }
      para(el);
    });
    pages.push(cs);
    // Seitenzahlen
    const total = pages.length;
    const pagesFinal = pages.map((c, i) => c + (total > 1 ? `BT 0.35 g /F1 7.5 Tf ${(W - M - 40).toFixed(2)} ${(M - 14).toFixed(2)} Td (${pdfEnc('Seite ' + (i + 1) + ' von ' + total)}) Tj ET 0 g\n` : ''));
    // PDF zusammensetzen
    const objs = [];
    const add = s => { objs.push(s); return objs.length; };
    const cat = add(''), pgs = add('');
    const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const kids = pagesFinal.map(c => { const cid = add(`<< /Length ${c.length} >>\nstream\n${c}endstream`);
      return add(`<< /Type /Page /Parent ${pgs} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${cid} 0 R >>`); });
    objs[cat - 1] = `<< /Type /Catalog /Pages ${pgs} 0 R >>`;
    objs[pgs - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
    let pdf = '%PDF-1.4\n%âãÏÓ\n'; const off = [];
    objs.forEach((o, i) => { off.push(pdf.length); pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; });
    const xref = pdf.length;
    pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + off.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
    pdf += `trailer\n<< /Size ${objs.length + 1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes = new Uint8Array(pdf.length); for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
    return bytes;
  }
  function pdfShow(title){
    let bytes; try { bytes = buildPdf(); } catch (e) { console.error(e); return toast('PDF konnte nicht erstellt werden: ' + e.message); }
    const name = (title || 'Dokument').replace(/[^\wäöüÄÖÜß\- ]+/g, '').trim().replace(/\s+/g, '_') + '_' + today() + '.pdf';
    pdfFile = new File([bytes], name, { type: 'application/pdf' });
    const url = URL.createObjectURL(pdfFile);
    openSheet(`<h2>📄 PDF ist fertig</h2><p class="lead">${esc(name)}</p>
      <button class="btn" onclick="App.pdfShare()">Teilen · Drucken · In Dateien sichern</button>
      <a class="btn sec" href="${url}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">PDF ansehen</a>
      <p class="note">Im Teilen-Menü findest du <b>Drucken</b> (AirPrint) und <b>In Dateien sichern</b>. Per Mail oder WhatsApp kannst du es auch direkt verschicken.</p>

  }
  async function pdfShare(){
    if (!pdfFile) return;
    try {
      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) await navigator.share({ files: [pdfFile], title: pdfFile.name });
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(pdfFile); a.download = pdfFile.name; document.body.appendChild(a); a.click(); a.remove(); }
    } catch (e) { if (e.name !== 'AbortError') toast('Teilen nicht möglich – „PDF ansehen“ nutzen'); }
  }

      return Object.assign({ Weinberg_ID: id, Name: name, Lage: lage, Rebsorte: sorte, Gemarkung: 'Beispielheim', Flur: '3', Flurstueck: id.slice(-2) + '/1',
        Flaeche_ha: +(areaM2(xy) / 10000).toFixed(3), Zeilenbreite_m: sp, Reihen_Anzahl: rows.length, Zeilenrichtung_Grad: rot, Versatz_m: 0,
        Umriss: JSON.stringify(xy.map(P.from)), Reihen: JSON.stringify(rows), Status: 'aktiv' }, extra || {});
    };
    S.snap.weinberge = [
      mk('WB-DEMO01', 'Kirchberg', 'Sonnenhang', 'Dornfelder', [49.851, 8.201], 120, 64, 12, 2.0),
      mk('WB-DEMO02', 'Am Bildstock', 'Sonnenhang', 'Riesling', [49.849, 8.205], 90, 50, -8, 1.8),
      mk('WB-DEMO03', 'Hohl', 'Mühlberg', 'Sauvignon Blanc', [49.853, 8.207], 70, 44, 25, 2.0)
    ];
    const f = frame(S.snap.weinberge[0]);
    const seg = f ? f.rows.slice(0, 14).map((r, i) => [i, 0, 1]).concat([[14, 0, 0.5]]) : [];
    S.snap.arbeiten = [{ Arbeit_ID: 'demo-a1', Datum: today(), Weinberg_ID: 'WB-DEMO01', Weinberg: 'Kirchberg', Arbeit: 'Rebschnitt',
      Anteil_Prozent: f ? +pctOf(f, segsToRows(seg)).toFixed(1) : 0, Reihen: JSON.stringify(seg), Stunden: 6, Person: 'Demo', Notiz: '' }]
;
    S.snap.mittel = [{ Mittel: 'Beispielmittel A (Fungizid)', Einheit: 'L', Basisaufwand_je_ha: 0.4, Max_Aufwand_je_ha: 1.6, Wartezeit_Tage: 35, Bemerkung: 'nur Beispiel' },
                     { Mittel: 'Beispielmittel B (Netzschwefel)', Einheit: 'kg', Basisaufwand_je_ha: 1.2, Max_Aufwand_je_ha: 4.8, Wartezeit_Tage: 56, Bemerkung: 'nur Beispiel' }];
  }

  /* ---------- Sheet & Navigation ---------- */
  function openSheet(html){ $('#sheetBody').innerHTML = html; $('#sheet').scrollTop = 0; $('#sheet').classList.add('on'); $('#backdrop').classList.add('on'); }
  function closeSheet(){ $('#sheet').classList.remove('on'); $('#backdrop').classList.remove('on'); if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} } }
  function go(t){ tab = t; closeSheet(); render(); window.scrollTo(0,0); }

  function route(){
    const su = location.hash.match(/setup=([^&]+)/);
    if (su) return applySetup(su[1]);
    const m = location.hash.match(/fass=([^&]+)/);
    if (m) { mode = 'keller'; tab = 'faesser'; render(); openFass(decodeURIComponent(m[1])); }
    const w = location.hash.match(/wb=([^&]+)/);
    if (w) { mode = 'weinberg'; tab = 'wb'; render(); openWeinberg(decodeURIComponent(w[1])); }
  }

  /* ---------- Start ---------- */
  function init(){
    ensure(); if (!location.hash) tab = 'home'; render(); route();
    if (curJob()) trkStart();
    window.addEventListener('hashchange', route);
    window.addEventListener('online', () => syncNow(false));
    window.addEventListener('offline', renderSync);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncNow(false); if (curJob()) wakeOn(); } });
    setInterval(() => syncNow(false), 120000);
    syncNow(false);
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
